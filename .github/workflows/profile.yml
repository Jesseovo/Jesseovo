name: Refresh profile artwork

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile.yml
      - scripts/build_artwork.py

permissions:
  contents: read

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Jesseovo
          outputs: |
            dist/github-snake.svg?color_snake=%23d97757&color_dots=%23f2f1ed,%23d7e5da,%23a4c9b2,%2376ab8c,%234f8568
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23e49a7c&color_dots=%2321262d,%23273d35,%233d6550,%235e9373,%238bb695

      - name: Publish artwork to output branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global credential.https://github.com.helper '!gh auth git-credential'
          publish_dir="$RUNNER_TEMP/profile-output"
          git init --initial-branch=output "$publish_dir"
          cd "$publish_dir"
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if git fetch --depth=1 origin output; then
            git checkout -B output FETCH_HEAD
          fi
          cp "$GITHUB_WORKSPACE"/dist/*.svg .
          git add -- '*.svg'
          if git diff --cached --quiet; then
            echo "Profile artwork is already up to date."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public profile artwork'
          git push origin output
